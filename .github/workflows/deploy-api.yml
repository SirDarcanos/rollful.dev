# SPDX-License-Identifier: MIT
# Deploys the Worker to api.rollful.dev when main changes.
#
# The checks run again here rather than trusting CI's result, so a deploy cannot ship code
# that was never verified at the commit being deployed.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with the Workers Scripts Edit permission
#   CLOUDFLARE_ACCOUNT_ID  the account owning rollful.dev
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/schema/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions: {}

# One deploy at a time, and never cancel one part-way through.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Deploy
        run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Waits before the first attempt, because a new version takes a moment to reach the
      # edge, and prints what came back so a failure says why rather than only that it
      # happened.
      #
      # Cloudflare's bot protection answers this runner with a managed challenge, which is
      # not a broken deploy and must not be reported as one. A challenge warns and passes;
      # anything else still fails. See CONTRIBUTING.md for the WAF rule that restores a real
      # check from CI.
      - name: Check the deployed API answers
        env:
          DEPLOY_CHECK_TOKEN: ${{ secrets.DEPLOY_CHECK_TOKEN }}
        run: |
          challenged=0
          for attempt in $(seq 1 10); do
            sleep 6
            body="$(curl -sS --max-time 10 -H "X-Rollful-Deploy-Check: $DEPLOY_CHECK_TOKEN" \
              'https://api.rollful.dev/v1/health' 2>&1 || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            if printf '%s' "$body" | grep -qiE 'Just a moment|challenge-platform|cf-browser-verification'; then
              challenged=1
            fi
            echo "Attempt $attempt: $(printf '%s' "$body" | head -c 150)"
          done

          if [ "$challenged" = 1 ]; then
            echo "::warning::Cloudflare challenged this runner, so the deploy could not be verified from CI. The upload itself succeeded."
            exit 0
          fi

          echo "::error::The deployed API did not answer /v1/health"
          exit 1
