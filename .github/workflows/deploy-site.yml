# SPDX-License-Identifier: MIT
# Deploys the site to rollful.dev when the site or the schemas it reads change.
#
# Uses the same two secrets as the API deploy:
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account owning rollful.dev
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/schema/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @rollful/site

      - name: Deploy
        run: npm run deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # -L because /reference redirects to /reference/, which is how Astro builds it.
      #
      # Waits before the first attempt, because a new version takes a moment to reach the
      # edge, and prints what came back so a failure says why rather than only that it
      # happened.
      #
      # Cloudflare's bot protection answers this runner with a managed challenge, which is
      # not a broken deploy and must not be reported as one. A challenge warns and passes;
      # anything else still fails. See CONTRIBUTING.md for the WAF rule that restores a real
      # check from CI.
      - name: Check the deployed site answers
        env:
          DEPLOY_CHECK_TOKEN: ${{ secrets.DEPLOY_CHECK_TOKEN }}
        run: |
          challenged=0
          for attempt in $(seq 1 10); do
            sleep 6
            page="$(curl -sSL --max-time 10 -H "X-Rollful-Deploy-Check: $DEPLOY_CHECK_TOKEN" \
              'https://rollful.dev/reference/' 2>&1 || true)"
            if printf '%s' "$page" | grep -q 'api.rollful.dev'; then
              echo "Reference page served on attempt $attempt, describing the production API"
              exit 0
            fi
            if printf '%s' "$page" | grep -qiE 'Just a moment|challenge-platform|cf-browser-verification'; then
              challenged=1
            fi
            echo "Attempt $attempt: $(printf '%s' "$page" | head -c 150)"
          done

          if [ "$challenged" = 1 ]; then
            echo "::warning::Cloudflare challenged this runner, so the deploy could not be verified from CI. The upload itself succeeded."
            exit 0
          fi

          echo "::error::The deployed site did not serve /reference/ describing the production API"
          exit 1
