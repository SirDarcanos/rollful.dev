     Copyright (C) 2026 Nicola Mustone

     The source of public/og.png. Rasterised by build-og.mjs rather than served directly:
     no social scraper renders SVG.

     The type is a system sans, which is what the site itself uses, and is named here rather
     than inherited because a rasteriser has no stylesheet to read. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="630"
  viewBox="0 0 1200 630"
  font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
>
  <defs>
    <radialGradient id="wash" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14ffec" stop-opacity="0.10" />
      <stop offset="1" stop-color="#14ffec" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#212121" />
  <circle cx="1010" cy="90" r="440" fill="url(#wash)" />

  <!-- The same d20 as the site, oversized and low-contrast behind the type. -->
  <g
    transform="translate(760 210) scale(16)"
    fill="none"
    stroke="#14ffec"
    stroke-opacity="0.13"
    stroke-width="0.7"
    stroke-linejoin="round"
    stroke-linecap="round"
  >
    <path d="M16 2 28.12 9v14L16 30 3.88 23V9z" />
    <path d="M16 7.5 23.7 20.3H8.3z" />
    <path d="M16 2v5.5M3.88 9 16 7.5M28.12 9 16 7.5" />
    <path
      d="M3.88 9 8.3 20.3M28.12 9 23.7 20.3M3.88 23 8.3 20.3M28.12 23 23.7 20.3M16 30 8.3 20.3M16 30 23.7 20.3"
    />
  </g>

  <!-- Wordmark -->
  <g
    transform="translate(88 96) scale(1.5)"
    fill="none"
    stroke="#14ffec"
    stroke-width="1.5"
    stroke-linejoin="round"
    stroke-linecap="round"
  >
    <path d="M16 2 28.12 9v14L16 30 3.88 23V9z" />
    <path d="M16 7.5 23.7 20.3H8.3z" />
    <path d="M16 2v5.5M3.88 9 16 7.5M28.12 9 16 7.5" />
    <path
      d="M3.88 9 8.3 20.3M28.12 9 23.7 20.3M3.88 23 8.3 20.3M28.12 23 23.7 20.3M16 30 8.3 20.3M16 30 23.7 20.3"
    />
  </g>
  <text x="152" y="130" fill="#fafafa" font-size="38" font-weight="600" letter-spacing="-0.5">
    Rollful
  </text>

  <!-- Headline -->
  <text x="88" y="290" fill="#ffffff" font-size="76" font-weight="700" letter-spacing="-2">
    Roll dice anywhere.
  </text>
  <text x="88" y="378" fill="#52525b" font-size="76" font-weight="700" letter-spacing="-2">
    Show the work.
  </text>

  <text x="88" y="452" fill="#a1a1aa" font-size="28">
    A hosted dice-rolling API powered by OpenDice.
  </text>

  <!-- One roll, showing the working the way the API does: the kept dice carry the accent and
       the one a keep rule dropped stays where it was rolled, dimmed. Dimmed rather than
       struck through — the rasteriser ignores text-decoration, and a line drawn over the
       glyph would need coordinates that only hold for the fonts on one machine.

       xml:space, and no line breaks inside: whitespace between tspans is drawn, so a tag on
       its own line puts a gap in the middle of the line. -->
  <text
    x="88"
    y="546"
    xml:space="preserve"
    font-family="SF Mono, Menlo, DejaVu Sans Mono, monospace"
    font-size="27"
    fill="#71717a"
  ><tspan>4d6kh3</tspan><tspan fill="#52525b">  →  </tspan><tspan fill="#14ffec" font-weight="600">5</tspan><tspan>, </tspan><tspan fill="#14ffec" font-weight="600">5</tspan><tspan>, </tspan><tspan fill="#14ffec" font-weight="600">4</tspan><tspan>, </tspan><tspan fill="#3f3f46">3</tspan><tspan fill="#52525b">  =  14</tspan></text>
</svg>
