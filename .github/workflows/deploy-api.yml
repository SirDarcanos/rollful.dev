# SPDX-License-Identifier: MIT
# Deploys the Worker to api.rollful.dev when main changes.
#
# The checks run again here rather than trusting CI's result, so a deploy cannot ship code
# that was never verified at the commit being deployed.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with the Workers Scripts Edit permission
#   CLOUDFLARE_ACCOUNT_ID  the account owning rollful.dev
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/schema/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions: {}

# One deploy at a time, and never cancel one part-way through.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Deploy
        run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Waits before the first attempt and keeps trying for two minutes. Cloudflare needs a
      # moment to put a new version on every edge, and this check used to start a tenth of a
      # second after wrangler returned and give up 25 seconds later — failing a deploy that
      # had worked. Each attempt prints what came back, so a real failure says why.
      - name: Check the deployed API answers
        run: |
          for attempt in $(seq 1 12); do
            sleep 10
            body="$(curl -sS --max-time 10 'https://api.rollful.dev/v1/health' 2>&1 || true)"
            if printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "Health check passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt: $(printf '%s' "$body" | head -c 150)"
          done
          echo "::error::The deployed API did not answer /v1/health within two minutes"
          exit 1
