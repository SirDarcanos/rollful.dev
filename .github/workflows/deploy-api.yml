# SPDX-License-Identifier: MIT
# Deploys the Worker to api.rollful.dev when main changes.
#
# The checks run again here rather than trusting CI's result, so a deploy cannot ship code
# that was never verified at the commit being deployed.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token with the Workers Scripts Edit permission
#   CLOUDFLARE_ACCOUNT_ID  the account owning rollful.dev
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/schema/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions: {}

# One deploy at a time, and never cancel one part-way through.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Deploy
        run: npx wrangler deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the deployed API answers
        run: |
          for attempt in 1 2 3 4 5; do
            if curl -sf 'https://api.rollful.dev/v1/health' | grep -q '"status":"ok"'; then
              echo "Health check passed"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying"
            sleep 5
          done
          echo "::error::The deployed API did not answer /v1/health"
          exit 1
