# SPDX-License-Identifier: MIT
# Deploys the site to rollful.dev when the site or the schemas it reads change.
#
# Uses the same two secrets as the API deploy:
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account owning rollful.dev
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'apps/site/**'
      - 'packages/schema/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @rollful/site

      - name: Deploy
        run: npm run deploy
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # -L because /reference redirects to /reference/, which is how Astro builds it.
      #
      # Waits before the first attempt and keeps trying for two minutes. Cloudflare needs a
      # moment to put a new version on every edge, and this check used to start immediately
      # after wrangler returned and give up 25 seconds later — failing a deploy that had
      # worked. Each attempt prints what came back, so a real failure says why.
      - name: Check the deployed site answers
        run: |
          for attempt in $(seq 1 12); do
            sleep 10
            page="$(curl -sSL --max-time 10 'https://rollful.dev/reference/' 2>&1 || true)"
            if printf '%s' "$page" | grep -q 'data-spec="https://api.rollful.dev/openapi.json"'; then
              echo "Reference page served on attempt $attempt, pointing at the production API"
              exit 0
            fi
            echo "Attempt $attempt: $(printf '%s' "$page" | head -c 150)"
          done
          echo "::error::The deployed site did not serve /reference/ pointing at the production API within two minutes"
          exit 1
